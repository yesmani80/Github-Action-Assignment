name: Workflow Assignment
on:
  push:
    branches: main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm Install

      - name: Run tests
        run: npm tests

      - name: Print a success message
        run: echo "Everything runs successfully"
